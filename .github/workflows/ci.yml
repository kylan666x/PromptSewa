name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare app (SQLite — same database drivers as production)
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database && touch database/database.sqlite
          php artisan migrate --force

      - name: Build frontend assets
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Lint
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
