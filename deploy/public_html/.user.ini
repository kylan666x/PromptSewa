; PromptVellum — public_html/.user.ini (cPanel: per-directory PHP-INI overrides)
; Only takes effect on PHP-FPM/LiteSpeed hosts (the standard cPanel setup).

; Uploads are prompt JSON/markdown + avatars — 10M is generous.
upload_max_filesize = 10M
post_max_size = 12M

; Shared hosts kill long requests; keep the playground/API calls snappy.
max_execution_time = 120
memory_limit = 256M
